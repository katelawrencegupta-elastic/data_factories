[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-factories"
version = "0.2.0"
description = "Shared Elastic synthetic data factories, grouped by the data they produce"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "PyYAML>=6.0",
    "requests>=2.28",
]

[project.optional-dependencies]
# reserved for future optional demo tooling
demos = []

[project.scripts]
df-dns-hunt = "data_factories.network.dns_hunt:main"
df-egress-exfil = "data_factories.network.egress_exfil:main"
df-ioc-hunt = "data_factories.threat_intel.ioc_hunt:main"
df-sync-hunt-iocs = "data_factories.threat_intel.sync_hunt_iocs:main"
df-hdsi-user = "data_factories.identity.hdsi_user:main"
df-employee-safety = "data_factories.identity.employee_safety:main"
df-aws-blast-radius = "data_factories.cloud_audit.aws_blast_radius:main"

[tool.setuptools.packages.find]
where = ["src"]

