[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-factories"
version = "0.1.0"
description = "Shared Elastic synthetic data factories (Blackstone NDJSON + ELK Co FinOps/GEV generators)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
demos = ["requests>=2.28"]

[project.scripts]
df-bx-dns-hunt = "data_factories.blackstone.dns_hunt:main"
df-bx-sync-hunt-iocs = "data_factories.blackstone.sync_hunt_iocs:main"
df-bx-employee-safety = "data_factories.blackstone.employee_safety:main"
df-bx-hdsi-user = "data_factories.blackstone.hdsi_user:main"
df-bx-ioc-hunt = "data_factories.blackstone.ioc_hunt:main"
df-bx-egress-exfil = "data_factories.blackstone.egress_exfil:main"
df-bx-blast-radius = "data_factories.blackstone.blast_radius:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"data_factories.blackstone" = ["*.yaml"]
